server {
    listen 8081;  # Pixelfed 포트
    server_name 10.20.16.66;

    # SSL 적용 시 (선택)
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/html/public;  # Pixelfed Laravel public 폴더
    index index.php index.html;

    # iframe 허용
    add_header X-Frame-Options "ALLOWALL" always;
    add_header Content-Security-Policy "frame-ancestors 'self' http://localhost http://10.20.16.66:8081" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;  # PHP-FPM 서비스 이름(app)과 포트 확인
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # 정적 파일 캐시
    location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
